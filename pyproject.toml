[project]
name = "bichecke"
version = "0.1.0"
description = "AI-based counterfeit bike parts detection - teacher VLM distillation labels train a YOLOv8m classifier served via a Gradio UI"
readme = "readme.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "gradio==5.49.1",
    "ultralytics==8.3.220",
    "opencv-python==4.12.0.88",
    "numpy==2.2.6",
    "pandas==2.3.3",
    "polars==1.34.0",
    "matplotlib==3.10.7",
    "plotly==6.3.1",
    "pillow==11.3.0",
    "openai>=1.0",
    "tqdm>=4.66",
]

[tool.uv]
package = false
